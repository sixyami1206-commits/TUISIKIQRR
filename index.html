<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>荷急運輸 | 追跡管理端末 PRO</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #0f172a;
            --accent: #2563eb;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); margin: 0; padding: 16px; color: var(--text-main); font-size: 15px; }

        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
        .app-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .app-title::before { content: ''; display: inline-block; width: 8px; height: 18px; background: var(--accent); border-radius: 4px; }

        .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.8); }
        .card-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); margin-bottom: 12px; }

        input, select {
            width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 500;
            background: #f8fafc; color: var(--text-main); outline: none; margin-bottom: 10px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

        button {
            border: none; border-radius: var(--radius-md); padding: 13px 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--accent); color: #fff; width: 100%; }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid var(--border-color); }
        .btn-success { background: #10b981; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; width: 100%; font-weight: bold; }
        .btn-danger-light { background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; width: 100%; }
        .btn-fun { background: #8b5cf6; color: #fff; }

        .scan-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-top: 12px; }
        .system-list { list-style: none; padding: 0; margin: 8px 0 14px 0; }
        .system-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.88rem; }
        .system-list li:last-child { border-bottom: none; }
        .system-list .label { color: var(--text-sub); }
        .system-list .value { font-weight: 700; color: var(--text-main); }

        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #fff;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">荷急運輸 追跡管理端末</div>
        <div style="font-size: 0.75rem; color: var(--text-sub); font-weight: 600;">v10.0 ULTRA</div>
    </div>

    <!-- 1. スキャン機能 -->
    <div class="card">
        <div class="card-title">01 / スキャン・受付解析</div>
        <div id="reader" style="width: 100%; border-radius: var(--radius-md); overflow: hidden; background: #000;"></div>
        <button id="camBtn" class="btn-primary" style="margin-top: 10px;" onclick="toggleCamera()">カメラ起動</button>
        
        <div id="scanResult" class="scan-card" style="display: none;">
            <div style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">【解析完了データ】</div>
            <ul id="parsedList" class="system-list"></ul>
            <button class="btn-success" style="width: 100%;" onclick="confirmScan()">この内容で受付確定 (STATUS: 1)</button>
        </div>
    </div>

    <!-- 2. 特定コード単別変更 -->
    <div class="card">
        <div class="card-title">02 / 特定コード個別変更</div>
        <input type="text" id="targetCode" placeholder="追跡番号を入力 (例: AM123456)">
        <div class="grid-2" style="margin-bottom: 8px;">
            <button class="btn-secondary" onclick="prepareSingle(2, '輸送中')">輸送中 (2)</button>
            <button class="btn-secondary" onclick="prepareSingle(3, '配達店到着')">店到着 (3)</button>
            <button class="btn-secondary" onclick="prepareSingle(4, '配達中')">配達中 (4)</button>
            <button class="btn-success" onclick="prepareSingle(5, '配達済み')">配達済 (5)</button>
        </div>
        <div class="grid-3">
            <button class="btn-warning" onclick="prepareSingle(92, '宛先不備')">宛先問題</button>
            <button class="btn-warning" onclick="prepareSingle(6, '不在持ち戻り')">不在</button>
            <button class="btn-warning" onclick="prepareSingle(93, 'サイズ超過')">サイズ幅</button>
        </div>
    </div>

    <!-- 3. 種別絞り込み一括更新 -->
    <div class="card">
        <div class="card-title">03 / 種別絞り込み一括更新</div>
        <select id="prefixSelect">
            <option value="AM">AMコードのみ一括</option>
            <option value="JP">JPコードのみ一括</option>
            <option value="LP">LPコードのみ一括</option>
            <option value="CJ">CJコードのみ一括</option>
            <option value="EN">ENコードのみ一括</option>
            <option value="TM">TMコードのみ一括</option>
        </select>
        
        <div class="grid-2" style="margin-bottom: 12px;">
            <button class="btn-secondary" onclick="sendBulk(2, '輸送中')">一括 輸送中</button>
            <button class="btn-secondary" onclick="sendBulk(3, '配達店到着')">一括 店到着</button>
            <button class="btn-success" onclick="sendBulk(5, '配達済み')">一括 配達済</button>
            <button class="btn-warning" onclick="sendBulk(91, '一時保留')">一括 保留</button>
        </div>

        <button class="btn-danger-light" onclick="clearCColumn()">「C欄」データを全件一括消去</button>
    </div>

    <!-- 4. 【緊急＆ネタ】完全一括操作エリア -->
    <div class="card" style="border: 2px solid #fee2e2;">
        <div class="card-title" style="color: #ef4444;">04 / 完全一括・特殊モード</div>
        
        <!-- ご要望の完全一括システムダウン -->
        <button class="btn-danger" style="padding: 16px; font-size: 1rem; margin-bottom: 12px;" onclick="systemDownAll()">
            🚨 【全件緊急】完全一括システムダウン
        </button>

        <!-- 追加したおもろボタン群 -->
        <div class="grid-3">
            <button class="btn-fun" onclick="sendFun(99, 'ブラックホールへ吸い込まれました')">🛸 異次元転送</button>
            <button class="btn-fun" onclick="sendFun(77, '配送員昼食中(13時再開予定)')">🍱 全員昼休憩</button>
            <button class="btn-fun" onclick="sendFun(88, '本日の業務は終了しました')">☕ 定時帰宅</button>
        </div>
    </div>

    <!-- 処理中全画面ロック -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText" style="font-weight: 600;">追跡システムに反映中…</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzo6B828MtuhHJBYpsAokFsRq4BQ7rGj4wGdoEQ7ir4yWCqExxkJWteusWVn4-BqUY8gQ/exec";

        let html5QrcodeScanner = null;
        let isScanning = false;
        let currentCode = "", currentDetail = "";

        function decodeQRData(rawText) {
            if (!rawText.startsWith("NIKKYU_SEC::")) return null;
            try {
                let enc = rawText.substring(12);
                let dec = "";
                for (let i = 0; i < enc.length; i++) dec += String.fromCharCode(enc.charCodeAt(i) - 5);
                return decodeURIComponent(escape(atob(dec)));
            } catch (e) { return null; }
        }

        function renderSystemList(text) {
            const listEl = document.getElementById('parsedList');
            listEl.innerHTML = '';
            const lines = text.split('\n');
            lines.forEach(line => {
                if(!line.trim()) return;
                const parts = line.split(/:\s*|：\s*/);
                const li = document.createElement('li');
                if(parts.length >= 2) {
                    li.innerHTML = `<span class="label">${parts[0]}</span><span class="value">${parts.slice(1).join(':')}</span>`;
                } else {
                    li.innerHTML = `<span class="label">詳細情報</span><span class="value">${line}</span>`;
                }
                listEl.appendChild(li);
            });
        }

        function toggleCamera() {
            const btn = document.getElementById('camBtn');
            if (isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    isScanning = false;
                    btn.innerText = "カメラ起動";
                });
            } else {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    onScanSuccess
                ).then(() => {
                    isScanning = true;
                    btn.innerText = "カメラ停止";
                });
            }
        }

        function onScanSuccess(decodedText) {
            const resultText = decodeQRData(decodedText);
            if (resultText) {
                const match = resultText.match(/追跡番号:\s*([A-Z0-9]+)/);
                currentCode = match ? match[1] : "";
                currentDetail = resultText;
                renderSystemList(resultText);
                document.getElementById('scanResult').style.display = "block";
            } else {
                alert("暗号の解読に失敗しました。");
            }
        }

        async function confirmScan() {
            if (!currentCode) return alert("追跡番号が確認できません");
            await callGas({ action: 'scan', code: currentCode, detail: currentDetail });
            document.getElementById('scanResult').style.display = "none";
        }

        async function prepareSingle(statusCode, statusName) {
            const codeInput = document.getElementById('targetCode').value.trim();
            if (!codeInput) return alert("追跡番号を入力してください");

            showLoading("コード存在確認中…");
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: 'check', code: codeInput })
                });
                const data = await res.json();
                hideLoading();

                if (data.result === 'not_found') {
                    alert("そのようなCODEはございません。");
                    return;
                }

                const currentStatus = data.currentStatus || "未設定";
                if (confirm(`【特定コード更新】\n追跡番号: ${codeInput}\n現在の状態: 「${currentStatus}」\n\n➔ 「${statusName}」に変更しますか？`)) {
                    await callGas({ action: 'single', code: codeInput, status: statusCode, message: statusName });
                }
            } catch (e) {
                hideLoading();
                if (confirm(`【確認】\nコード [ ${codeInput} ] を「${statusName}」に変更しますか？`)) {
                    await callGas({ action: 'single', code: codeInput, status: statusCode, message: statusName });
                }
            }
        }

        async function sendBulk(statusCode, statusName) {
            const prefix = document.getElementById('prefixSelect').value;
            if (!confirm(`【絞り込み一括】\n対象: [ ${prefix} ] から始まる全コード\n変更後: 「${statusName}」\n\n実行しますか？`)) return;

            await callGas({ action: 'bulk_update', prefix: prefix, status: statusCode, message: statusName });
        }

        // ★ 完全一括システムダウン
        async function systemDownAll() {
            if (!confirm("【🚨 最重要警告】\nコード関係なしに【全件】一括ダウンします。\n\nB欄 ➔ 5\nC欄 ➔ 「システムダウン 追跡不可」\n\n本当に実行しますか？")) return;
            await callGas({ action: 'system_down_all' });
        }

        // ★ ネタボタン用一括送信
        async function sendFun(statusCode, statusName) {
            if (!confirm(`【特殊モード実行】\n全件を「${statusName}」にしますか？`)) return;
            await callGas({ action: 'fun_all', status: statusCode, message: statusName });
        }

        async function clearCColumn() {
            if (!confirm("【警告】\nC欄データを全件削除します。よろしいですか？")) return;
            await callGas({ action: 'clear_c_column' });
        }

        async function callGas(payload) {
            showLoading("追跡システムに反映中…");
            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                setTimeout(() => {
                    hideLoading();
                    alert("追跡システムへの反映が完了しました。");
                }, 800);
            } catch (err) {
                hideLoading();
                alert("通信エラーが発生しました。");
            }
        }

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = "flex";
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = "none";
        }
    </script>
</body>
</html>
